name: Verify and build Helferlein

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run einvoice:prepare
      - run: npm run check
        env:
          EINVOICE_REQUIRE_INTEGRATION: '1'
      - run: npm run build:app

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build app and matching offline validator
        run: npm run electron:build:${{ matrix.platform }} -- --${{ matrix.arch }} --publish never
      - name: Verify installed app resources with bundled Electron and Java
        run: node scripts/smoke-packaged.mjs
      - name: Verify source regression suite
        run: npm test
        env:
          EINVOICE_REQUIRE_INTEGRATION: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: helferlein-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.exe
            dist-electron/*.blockmap
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: helferlein-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
